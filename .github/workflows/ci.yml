name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 headers (cgo dep of golang.design/x/clipboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" -trimpath ./...

      - name: Test
        run: go test ./... -race

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 headers (cgo dep of golang.design/x/clipboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  windows-credentials:
    name: windows credential adapter
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test injectable credential adapter
        run: go test ./internal/mattermost ./internal/config ./internal/lockfile ./cmd/mmk

      - name: Vet relevant packages
        run: go vet ./internal/mattermost ./internal/config ./internal/lockfile ./cmd/mmk

      - name: Build command
        run: go build ./cmd/mmk

  macos-credentials:
    name: macOS credential adapter
    runs-on: macos-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test injectable credential adapter
        run: go test ./internal/mattermost ./internal/config ./internal/lockfile ./cmd/mmk

      - name: Vet relevant packages
        run: go vet ./internal/mattermost ./internal/config ./internal/lockfile ./cmd/mmk

      - name: Build command
        run: go build ./cmd/mmk

  darwin-nocgo-compile:
    name: Darwin no-cgo compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Compile relevant tests without cgo
        env:
          GOOS: darwin
          CGO_ENABLED: 0
        run: |
          go test -c -o /tmp/config.test ./internal/config
          go test -c -o /tmp/mattermost.test ./internal/mattermost
          go test -c -o /tmp/lockfile.test ./internal/lockfile
          go test -c -o /tmp/mmk.test ./cmd/mmk
