# GoReleaser config for mmk
# Docs: https://goreleaser.com
version: 2

project_name: mmk

before:
  hooks:
    - go mod tidy

builds:
  - id: mmk
    main: ./cmd/mmk
    binary: mmk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is rare and not worth the matrix slot for a TUI
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # macOS Keychain Services is only available through Security.framework,
  # so Darwin releases are built with cgo on the macOS release runner.
  - id: mmk-darwin
    main: ./cmd/mmk
    binary: mmk
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: mmk
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Performance
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - id: mmk
    package_name: mmk
    vendor: mmk contributors
    homepage: https://github.com/nosovk/mmk
    maintainer: nosovk
    description: |-
      A fast, keyboard-driven Mattermost TUI.
      Multiple servers, cached history, realtime posts, and threads in one terminal client.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: net
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/mmk/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/mmk/README.md

release:
  github:
    owner: nosovk
    name: mmk
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## mmk {{ .Tag }}

    A fast, keyboard-driven Mattermost TUI.
  # Two footers: one for pre-releases, one for stable.
  #
  # Everything here is permanent config, so release-specific warnings belong
  # in that release's body rather than a template that outlives the release.
  #
  # The pre-release text deliberately omits the .deb/.rpm/.apk lines:
  # installing a beta system-wide through a package manager is a worse
  # idea than dropping a binary on $PATH, and the point of this channel
  # is that it stays easy to back out of.
  footer: |
    ---
    {{- if .Prerelease }}
    **This is a pre-release.** It is not published to the Homebrew tap, and
    `go install ...@latest` will not resolve to it. Both are deliberate:
    pre-releases are opt-in only, and nothing you already have installed
    will move to this by itself.

    - **Go:** `go install github.com/nosovk/mmk/cmd/mmk@{{ .Tag }}`
    - **Linux/macOS:** download the `.tar.gz`, extract, and place `mmk` in your `$PATH`
    - **Windows:** download the `.zip`, extract `mmk.exe`, add to `PATH`

    Verify downloads with `checksums.txt`.

    **Please run it with debug logging on:**

    ```
    MMK_DEBUG=1 mmk
    ```

    That writes `mmk-debug.log` to the working directory. If anything looks
    wrong, preserve that file before launching mmk again because each run
    truncates it. Review logs for sensitive message or server metadata before
    sharing them.

    Please report anything you find at
    https://github.com/nosovk/mmk/issues -- including "it seemed fine",
    which is genuinely useful and almost never gets sent.
    {{- else }}
    **Install**

    - **Linux/macOS:** download the appropriate `.tar.gz`, extract, and place `mmk` in your `$PATH`
    - **Debian/Ubuntu:** `sudo dpkg -i mmk_*.deb`
    - **Fedora/RHEL:** `sudo rpm -i mmk_*.rpm`
    - **Alpine:** `sudo apk add --allow-untrusted mmk_*.apk`
    - **Windows:** download the `.zip`, extract `mmk.exe`, add to `PATH`
    - **Go:** `go install github.com/nosovk/mmk/cmd/mmk@{{ .Tag }}`

    Verify downloads with `checksums.txt`.
    {{- end }}

# Homebrew tap.
#
# Casks, not formulas: goreleaser deprecated `brews` in v2.10 and the
# historical formula was a hack for installing pre-compiled binaries.
# Users still install with:
#
#     brew install nosovk/tap/mmk
#
# Two consequences of the move worth knowing:
#
#   1. Casks are macOS-only. Homebrew-on-Linux users lose this path and
#      should use the .deb/.rpm/.apk or the tarball, which is the better
#      route for them anyway.
#   2. Existing installs do NOT migrate by themselves. The tap repo needs
#      a tap_migrations.json containing {"mmk": "mmk"} and Formula/mmk.rb
#      deleted; only then does `brew upgrade` move someone from the old
#      formula to the cask. That is manual work in nosovk/homebrew-tap,
#      and it should happen right after the first stable release that
#      publishes a cask.
#
# The token is a fine-grained PAT scoped to the homebrew-tap repo with
# contents:write, stored as HOMEBREW_TAP_GITHUB_TOKEN in this repo's
# Actions secrets.
homebrew_casks:
  - name: mmk
    repository:
      owner: nosovk
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "mmk: brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://github.com/nosovk/mmk
    description: A fast, keyboard-driven Mattermost TUI
    # Helps `brew audit` when the homepage and the download domain differ.
    url:
      verified: github.com/nosovk/mmk
    # Skip the prerelease tags goreleaser auto-flags so the tap only
    # tracks stable releases.
    skip_upload: auto
    binaries:
      - mmk
    # mmk's binaries are not signed or notarized, so macOS quarantines
    # them on download and Gatekeeper refuses to run them. Stripping the
    # attribute at install time is what goreleaser's migration guide
    # prescribes for unsigned casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mmk"]
          end
